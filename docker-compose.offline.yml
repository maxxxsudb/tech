# Офлайн-режим: Grafana ничего не качает из интернета, Infinity берётся из ./offline/plugins
#   docker compose -f docker-compose.yml -f docker-compose.offline.yml up -d
services:
  grafana:
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: ""
      # Не ставить плагины, которые Grafana по умолчанию докачивает при старте
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./offline/plugins:/var/lib/grafana/plugins:ro
